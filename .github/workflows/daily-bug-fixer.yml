name: Daily Auto-Improving Bug Fixer

on:
  schedule:
    # Executa todos os dias às 03:00 UTC (madrugada)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite disparo manual sob demanda

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  fix-bugs:
    name: Fix Daily Issues & Self-Improve
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Safe Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Run Self-Improving Bug Fixer Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm run agent:run

      - name: Persist Updated Learning Memory
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main || true
          if [ -d ".agent" ]; then
            git add .agent/knowledge-base.json || true
            if ! git diff --cached --quiet; then
              git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "chore(agent): update learning memory and success rate metrics [skip ci]" || true
              git push origin main || true
            else
              echo "Nenhuma alteração na memória do agente para persistir."
            fi
          fi
